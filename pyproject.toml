[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
include = ["late_interaction_kernels"]

[project]
name = "late-interaction-kernels"
dynamic = ["version"]
description = "Fused Triton kernels for late-interaction (MaxSim) scoring — ColBERT, ColPali, ModernColBERT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aurélien Lac", email = "aurelien.lac@hcompany.ai" },
  { name = "Tony Wu", email = "tony.wu@hcompany.ai" },
]
maintainers = [
  { name = "Aurélien Lac", email = "aurelien.lac@hcompany.ai" },
  { name = "Tony Wu", email = "tony.wu@hcompany.ai" },
]
keywords = [
  "late-interaction", "maxsim", "colbert", "colpali", "moderncolbert",
  "triton", "retrieval", "ir", "rerank", "flash-attention", "gpu-kernels",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # The actual torch index (CPU vs CUDA) is selected by the `torch-cpu` /
  # `torch-cuda` extras below. Plain `uv sync` without either extra falls
  # back to PyPI's default wheel.
  "torch>=2.5,<3",
  # Triton ships with CUDA torch wheels on Linux. On macOS / Windows the
  # kernels cannot run, but the reference implementation and imports do.
  "triton>=3.0,<4; platform_system=='Linux'",
]

[project.optional-dependencies]
# Everything needed to run tests and benchmarks locally.
dev = [
  "numpy>=1.21,<3",
  "pandas>=1.5,<4",
  "pytest>=7,<10",
  "pytest-xdist>=3,<4",
  "ruff>=0.4,<1",
  "tabulate>=0.9,<1",
  # ty is alpha (0.0.x); every 0.0.z release can break. Cap below 0.1 and
  # revisit on each bump (see [tool.ty.rules] notes below).
  "ty>=0.0.20,<0.1",
]
# PyLate integration (drop-in for `pylate.scores.colbert_scores`). 1.3 is
# the first release with the `(queries_mask, documents_mask)` signature
# we patch against — older PyLate (1.2.x) used a single `mask=` kwarg and
# is not supported.
pylate = ["pylate>=1.3.3,<2"]
# Pick exactly one of these to choose the torch wheel source. CI uses
# `torch-cpu` to skip the multi-GB CUDA wheel; local GPU dev uses
# `torch-cuda`. The `[tool.uv]` conflict block below makes them mutually
# exclusive so the lockfile resolves cleanly for both.
torch-cpu = ["torch>=2.5,<3"]
torch-cuda = ["torch>=2.5,<3"]

[project.urls]
Homepage = "https://github.com/hcompai/late-interaction-kernels"
Repository = "https://github.com/hcompai/late-interaction-kernels"
Issues = "https://github.com/hcompai/late-interaction-kernels/issues"
Changelog = "https://github.com/hcompai/late-interaction-kernels/blob/main/CHANGELOG.md"
Documentation = "https://github.com/hcompai/late-interaction-kernels#readme"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E741: `l` is the canonical logsumexp accumulator (FlashAttention / Liger).
# B023: benchmark closures intentionally capture loop vars.
ignore = ["E501", "B008", "E741", "B023"]

# Torch wheel source is picked per-extra: `--extra torch-cpu` for CI / CPU
# laptops, `--extra torch-cuda` for local GPU dev. The conflict block keeps
# them mutually exclusive so the lockfile stays consistent. On macOS,
# PyPI's default torch wheel already supports MPS, so we skip the CPU
# index there (the `pytorch-cpu` index has no Darwin wheels).
[tool.uv]
conflicts = [[{ extra = "torch-cpu" }, { extra = "torch-cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-cu124", extra = "torch-cuda", marker = "platform_system == 'Linux'" },
]

[tool.ty.src]
# Only type-check the shipped package and the test suite. Benchmarks and
# scripts are exploratory and not part of the public surface.
include = ["late_interaction_kernels", "tests"]

[tool.ty.rules]
# ty is still alpha (0.0.x) and trips on a few patterns that are pervasive
# in this codebase. The rules below are silenced because the diagnostics
# they emit are dominated by alpha-ty narrowing limitations and torch's
# loose `Tensor | None` typing — revisit on each ty bump.

# Triton ships only with CUDA torch on Linux; on the CPU dev wheel and any
# non-Linux platform it cannot be resolved. Pylate is an optional extra
# not installed for `--extra dev`. Both are intentionally unresolvable in
# the default environment, so we silence at the project level rather than
# sprinkling per-line ignores across ~30 import sites.
unresolved-import = "ignore"
# torch.autograd.Function.backward has a deliberately broad runtime
# signature; every Function override fires this rule.
invalid-method-override = "ignore"
# `x.grad`, `tensor_or_none.stride()`, accumulator-pattern variables that
# start as None and are unconditionally bound in a loop — ty doesn't
# narrow these. autograd code and tests rely on this pattern heavily.
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
# Triton kernel launches accept runtime meta-arguments (`num_warps`,
# `num_stages`, `num_ctas`, ...) that are not in the @triton.jit function's
# static signature; triton's launch protocol injects them. Only fires on
# Linux where triton actually resolves.
unknown-argument = "ignore"
# Pre-existing `# type: ignore` comments in pylate_compat.py become "unused"
# once we silence `unresolved-import` above. They are still load-bearing
# for any other type checker someone might run, so leave them in place.
unused-type-ignore-comment = "ignore"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device",
  "slow: long-running perf / fuzz tests",
  "perf: performance regression test (compares median latency vs benchmarks/baselines/{GPU}.json)",
]
