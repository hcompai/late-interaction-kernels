[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
include = ["late_interaction_kernels"]

[project]
name = "late-interaction-kernels"
dynamic = ["version"]
description = "Fused Triton/Metal kernels for late-interaction (MaxSim) scoring — ColBERT, ColPali, ModernColBERT, LateOn."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aurélien Lac", email = "aurelien.lac@hcompany.ai" },
  { name = "Tony Wu", email = "tony.wu@hcompany.ai" },
]
maintainers = [
  { name = "Aurélien Lac", email = "aurelien.lac@hcompany.ai" },
  { name = "Tony Wu", email = "tony.wu@hcompany.ai" },
]
keywords = [
  "late-interaction", "maxsim", "colbert", "colpali", "moderncolbert", "lateon",
  "triton", "metal", "mps", "retrieval", "ir", "rerank", "plaid", "gpu-kernels",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Torch index (CPU/CUDA) is selected by the `torch-cpu`/`torch-cuda` extras;
  # plain `uv sync` without an extra falls back to PyPI's default wheel.
  "torch>=2.5,<3",
  # Triton only ships on Linux CUDA wheels; macOS/Windows use the pure-PyTorch reference.
  "triton>=3.0,<4; platform_system=='Linux'",
]

[project.optional-dependencies]
# Everything needed to run tests and linting locally.
dev = [
  "numpy>=1.21,<3",
  "pytest>=7,<10",
  "ruff>=0.4,<1",
  # ty is alpha; every 0.0.z can break — cap below 0.1 and revisit each bump.
  "ty>=0.0.20,<0.1",
]
# PyLate drop-in (`patch_pylate()`). >=1.3.3: first release with the
# `(queries_mask, documents_mask)` signature we patch against. The patch
# handles both module layouts: `pylate.scores.scores` (<=1.4) and
# `pylate.scores.colbert` + the ColBERTScores loss routing (>=1.5). On
# >=1.5.1 PyLate has native LIK support and the patch is a deprecated no-op.
pylate = ["pylate>=1.3.3,<2"]
# colpali_engine drop-in (`patch_colpali_engine()`). >=0.3.10: first release
# with the patched-API surface (the ColbertLoss family + the
# `BaseVisualRetrieverProcessor.score_multi_vector` helper). On >=0.3.17
# colpali-engine has native LIK support and the patch is a deprecated no-op.
# CPU-only extra:
# colpali_engine's torchvision/transformers tree conflicts with the cu124
# torch wheel, so it's never co-activated with `torch-cuda` (the GPU parity
# tests install it out-of-band — see scripts/sky_colpali_compat_test.yaml).
colpali = ["colpali-engine>=0.3.10,<1"]
# Mutually exclusive wheel sources; CI uses `torch-cpu`, GPU dev uses `torch-cuda`.
torch-cpu = ["torch>=2.5,<3"]
torch-cuda = ["torch>=2.5,<3"]

[project.urls]
Homepage = "https://github.com/hcompai/late-interaction-kernels"
Repository = "https://github.com/hcompai/late-interaction-kernels"
Issues = "https://github.com/hcompai/late-interaction-kernels/issues"
Changelog = "https://github.com/hcompai/late-interaction-kernels/blob/main/CHANGELOG.md"
Documentation = "https://hcompai.github.io/late-interaction-kernels/"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E741: `l` is the canonical logsumexp accumulator (FlashAttention / Liger).
# B023: benchmark closures intentionally capture loop vars.
ignore = ["E501", "B008", "E741", "B023"]

# Per-extra wheel source: `--extra torch-cpu` for CI/CPU, `--extra torch-cuda` for GPU.
# PyPI's default torch supports MPS on macOS; pytorch-cpu has no Darwin wheels.
[tool.uv]
conflicts = [[{ extra = "torch-cpu" }, { extra = "torch-cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-cu124", extra = "torch-cuda", marker = "platform_system == 'Linux'" },
]

[tool.ty.src]
# Benchmarks/scripts are exploratory; exclude them from type-checking.
include = ["late_interaction_kernels", "tests"]

[tool.ty.rules]
# Alpha-ty narrowing gaps + torch's loose typing produce too many false positives;
# revisit on each ty bump.

# Triton (Linux-only) and pylate (optional extra) are intentionally absent in the dev
# environment — silence project-wide rather than sprinkling ~30 per-line ignores.
unresolved-import = "ignore"
# autograd.Function.backward has a deliberately broad signature; every override fires this.
invalid-method-override = "ignore"
# ty doesn't narrow accumulator-pattern vars (`.grad`, `.stride()`, None→bound-in-loop).
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
# Triton's launch protocol injects `num_warps`, `num_stages`, etc. at runtime.
unknown-argument = "ignore"
# `# type: ignore` in pylate_compat.py stays load-bearing for other type checkers.
unused-type-ignore-comment = "ignore"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device",
  "slow: long-running perf / fuzz tests",
]
