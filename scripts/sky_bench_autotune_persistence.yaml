# Validates the autotune-cost reductions from PR #65 (persistent disk cache
# + small-input bypass + key cleanup). Reproduces issue lightonai/pylate#224
# §2 shapes via the 4-D dispatch from PR #63. Single H100, ~5 min, auto-down.

name: lik-autotune-persistence

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  # uv resolves triton>=3.0,<4 → the 3.4+ persistent-cache feature lands
  # automatically. The previous NGC image needed an explicit triton bump.
  uv sync --frozen --extra dev --extra torch-cuda

run: |
  set -eux
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  nvidia-smi | head -10
  uv run python scripts/_bench_autotune_persistence.py
