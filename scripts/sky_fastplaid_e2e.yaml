# End-to-end fast-plaid vs fused kernel comparison on 1×H100.
#   sky launch scripts/sky_fastplaid_e2e.yaml -c lik-e2e -y
# Reuses an existing cluster:
#   sky exec lik-e2e scripts/sky_fastplaid_e2e.yaml

name: lik-fastplaid-e2e

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 8+

workdir: .

config:
  kubernetes:
    pod_config:
      spec:
        priorityClassName: low

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda
  # fast-plaid ships per-torch-version wheels; 1.4.6.280 is the torch-2.8 one.
  uv pip install "fast-plaid==1.4.6.280"

run: |
  set -eux
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  # If we launched fresh, setup already ran. `sky exec` against an existing
  # cluster skips the setup block — re-install on demand.
  uv run python -c "import fast_plaid, triton, late_interaction_kernels" 2>/dev/null || {
    uv sync --frozen --extra dev --extra torch-cuda
    uv pip install "fast-plaid==1.4.6.280"
  }
  uv run python -c "import torch, triton, fast_plaid; print('torch', torch.__version__, 'triton', triton.__version__)"
  uv run python -c "import torch; print(torch.cuda.get_device_name())"

  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  GPU=$(uv run python -c "import torch; print(torch.cuda.get_device_name(0).replace(' ', '_'))")
  ART=/tmp/artifacts/${STAMP}_${GPU}_e2e
  mkdir -p "${ART}"

  echo ">>> fast-plaid e2e comparison"
  uv run python benchmarks/plaid/bench_fastplaid_e2e.py --outdir "${ART}" --small 2>&1 | tee "${ART}/bench_e2e.log"

  echo ">>> artifact summary"
  find "${ART}" -type f | sort
  echo "Artifacts at: ${ART}"
