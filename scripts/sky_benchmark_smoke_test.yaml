# Smoke-test benchmark run on 1×H100: bench_forward + bench_backward_method only.
# Cheapest sanity check that the bench scripts still run on a fresh CUDA host.
# Full sweep: sky_run_all_benchmarks.yaml. Tests live in GitHub Actions (gpu-ci.yml).
#
#   sky jobs launch scripts/sky_benchmark_smoke_test.yaml

name: lik-benchmark-smoke-test

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  # Required when launching from a git worktree — the `.git` file points
  # at a host path that doesn't exist on the SkyPilot node, so hatch-vcs
  # can't infer a version. Placeholder; never escapes the bench host.
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  # Bare CUDA image: no Python, no curl. Bootstrap uv; uv manages its own Python.
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda

run: |
  set -eux
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  uv run python -c "import torch; print('GPU:', torch.cuda.get_device_name(), '| torch:', torch.__version__)"
  uv run python benchmarks/kernels/bench_forward.py --outdir /tmp/bench
  uv run python benchmarks/kernels/bench_backward_method.py --outdir /tmp/bench
  ls -la /tmp/bench
