# Real PyLate training-step benchmark for LateOn-Code-edge on one H100.
#
#   sky launch scripts/sky_lateon_edge.yaml -c lik-lateon-edge -y
#
# Runs `bench_pylate_lateon.py` with:
#   * `lightonai/LateOn-Code-edge` (d=48, max_len=2047, ModernBERT-edge,
#     17M params — fine-tuned by LightOn for code retrieval)
# across two recipes:
#   * contrastive       — simple baseline, encoder-bound
#   * cached (Lq=32)    — simulates the GradCache-style in-batch-negatives
#     recipe at medium batch / long Ld
# with and without `patch_pylate()` to quantify the actual end-to-end win.

name: lik-lateon-edge

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda --extra pylate
  uv pip install "pylate==1.3.3"
  uv run python -c "
  import late_interaction_kernels as L
  import pylate, sentence_transformers
  print('lik', L.__version__)
  print('pylate', pylate.__version__, 'st', sentence_transformers.__version__)
  "

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  export LIK_SUPPRESS_NORM_WARN=1
  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  ART=/tmp/artifacts/lateon_edge_${STAMP}
  mkdir -p "${ART}"

  MODEL="lightonai/LateOn-Code-edge"

  echo "=============================================================="
  echo "  LateOn-Code-edge: contrastive, bs=16, Lq=32, Ld=2048"
  echo "=============================================================="
  uv run python benchmarks/bench_pylate_lateon.py \
      --model "${MODEL}" \
      --recipe contrastive \
      --batch-size 16 --Lq 32 --Ld 2048 \
      --iters 8 --warmup 2 --outdir "${ART}" \
      2>&1 | tee "${ART}/contrastive_bs16_ld2048.log"

  echo "=============================================================="
  echo "  LateOn-Code-edge: contrastive, bs=32, Lq=32, Ld=2048"
  echo "=============================================================="
  uv run python benchmarks/bench_pylate_lateon.py \
      --model "${MODEL}" \
      --recipe contrastive \
      --batch-size 32 --Lq 32 --Ld 2048 \
      --iters 8 --warmup 2 --outdir "${ART}" \
      2>&1 | tee "${ART}/contrastive_bs32_ld2048.log"

  echo "=============================================================="
  echo "  LateOn-Code-edge: cached, bs=64, mini=16, Lq=32, Ld=2048"
  echo "=============================================================="
  uv run python benchmarks/bench_pylate_lateon.py \
      --model "${MODEL}" \
      --recipe reason \
      --batch-size 64 --mini-batch-size 16 --Lq 32 --Ld 2048 \
      --iters 8 --warmup 2 --outdir "${ART}" \
      2>&1 | tee "${ART}/cached_bs64_mini16_ld2048.log"

  # ------ Huge batch / long context: where the kernel story gets loud --------
  # The encoder is only 17 M params, so the MaxSim slice is a much bigger
  # fraction of the step. At these shapes the `[bs, Ld]` activation tensors
  # also start dominating VRAM and vanilla PyLate chunks MaxSim into
  # (bs/mini)^2 calls — that's where the end-to-end gap opens up.
  echo "=============================================================="
  echo "  LateOn-Code-edge: cached, bs=128, mini=16, Lq=32, Ld=2048"
  echo "=============================================================="
  uv run python benchmarks/bench_pylate_lateon.py \
      --model "${MODEL}" \
      --recipe reason \
      --batch-size 128 --mini-batch-size 16 --Lq 32 --Ld 2048 \
      --iters 5 --warmup 2 --outdir "${ART}" --grad-checkpoint \
      2>&1 | tee "${ART}/cached_bs128_mini16_ld2048.log"

  echo "=============================================================="
  echo "  LateOn-Code-edge: cached, bs=64, mini=8, Lq=32, Ld=4096"
  echo "=============================================================="
  uv run python benchmarks/bench_pylate_lateon.py \
      --model "${MODEL}" \
      --recipe reason \
      --batch-size 64 --mini-batch-size 8 --Lq 32 --Ld 4096 \
      --iters 5 --warmup 2 --outdir "${ART}" --grad-checkpoint \
      2>&1 | tee "${ART}/cached_bs64_mini8_ld4096.log"

  echo "Artifacts at: ${ART}"
