# Real PyLate training-step benchmark for LateOn-Code-edge on one H100.
#
#   sky exec flash-colbert-dev scripts/sky_lateon_edge.yaml --gpus H100:1
#
# Runs `bench_pylate_moderncolbert.py` with:
#   * `lightonai/LateOn-Code-edge` (d=48, max_len=2047, ModernBERT-edge,
#     17M params — fine-tuned by LightOn for code retrieval)
# across three recipes:
#   * contrastive       — simple baseline, encoder-bound
#   * cached (Lq=32)    — simulates the GradCache-style in-batch-negatives
#     recipe at medium batch / long Ld
# with and without `patch_pylate()` to quantify the actual end-to-end win.

name: lik-lateon-edge

resources:
  infra: kubernetes
  accelerators: H100:1

workdir: .

run: |
  set -eux
  cd ~/sky_workdir

  pip install --no-cache-dir -e ".[dev,pylate]" --force-reinstall --no-deps
  # LateOn-Code-edge was uploaded with sentence-transformers 5.x Dense
  # layers (`use_residual`). Upgrade ST + PyLate — but with `--no-deps`
  # to avoid triggering pip's full backtracking solver, which can OOM or
  # spin for 30+ minutes downloading every historical `anyio` /
  # `httpcore` / `rfc3986`.
  pip install --no-cache-dir --no-deps -U "pylate>=1.3.3" "sentence-transformers>=5.1"
  python -c "import late_interaction_kernels as L; print('lik', L.__version__)"
  python -c "import pylate, sentence_transformers; print('pylate', pylate.__version__, 'st', sentence_transformers.__version__)"

  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  ART=/tmp/artifacts/lateon_edge_${STAMP}
  mkdir -p "${ART}"

  MODEL="lightonai/LateOn-Code-edge"

  echo "=============================================================="
  echo "  LateOn-Code-edge: contrastive, bs=16, Lq=32, Ld=2048"
  echo "=============================================================="
  python benchmarks/bench_pylate_moderncolbert.py \
      --model "${MODEL}" \
      --recipe contrastive \
      --batch-size 16 --Lq 32 --Ld 2048 \
      --iters 8 --warmup 2 --outdir "${ART}" \
      2>&1 | tee "${ART}/contrastive_bs16_ld2048.log"

  echo "=============================================================="
  echo "  LateOn-Code-edge: contrastive, bs=32, Lq=32, Ld=2048"
  echo "=============================================================="
  python benchmarks/bench_pylate_moderncolbert.py \
      --model "${MODEL}" \
      --recipe contrastive \
      --batch-size 32 --Lq 32 --Ld 2048 \
      --iters 8 --warmup 2 --outdir "${ART}" \
      2>&1 | tee "${ART}/contrastive_bs32_ld2048.log"

  echo "=============================================================="
  echo "  LateOn-Code-edge: cached, bs=64, mini=16, Lq=32, Ld=2048"
  echo "=============================================================="
  python benchmarks/bench_pylate_moderncolbert.py \
      --model "${MODEL}" \
      --recipe reason \
      --batch-size 64 --mini-batch-size 16 --Lq 32 --Ld 2048 \
      --iters 8 --warmup 2 --outdir "${ART}" \
      2>&1 | tee "${ART}/cached_bs64_mini16_ld2048.log"

  echo "Artifacts at: ${ART}"
