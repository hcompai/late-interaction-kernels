# Run every benchmark behind docs/benchmarks.md on a single 1×H100 cluster
# (~25 min wall-clock). Tars the result directory back to the controller
# for download.
#
#   sky launch -c lik-bench-all scripts/sky_run_all_benchmarks.yaml -y
#   sky logs lik-bench-all
#   sky down lik-bench-all -y
#
# Skipped sections (kept as-is in docs):
#   * Apple Silicon (MPS) — needs an Apple device, not H100.
#   * 8-GPU DDP cached-contrastive — single-cluster budget.

name: lik-bench-all

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
  # Space-separated subset of bench tags to run; empty means "run all".
  # Tags: forward, inference_edge, normalize, backward_method, lateon,
  #       cached_maxsim, flash_maxsim, fp8, fused_head_train,
  #       pylate_training, pylate_lateon, decompress_maxsim,
  #       fastplaid_e2e, pylate_realdata.
  # Smoke-test the README numbers with:
  #   sky launch --env RUN_ONLY="forward cached_maxsim fused_head_train fp8" ...
  RUN_ONLY: ""

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda --extra pylate
  # pylate 1.5+ broke patch_pylate's `(queries_mask, documents_mask)` signature.
  uv pip install "pylate==1.3.3"
  # Optional baselines; failure to install is non-fatal — each bench probes
  # via `import` and skips itself if the dep is missing.
  uv pip install "flash-maxsim==0.2.0" || true
  uv pip install "fast-plaid==1.4.6.280" || true

run: |
  set -uxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  source .venv/bin/activate
  export LIK_SUPPRESS_NORM_WARN=1

  python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__)"

  OUT=/tmp/bench
  mkdir -p "$OUT"

  run() {
    echo ""
    echo "=================================================================="
    echo "Running: $*"
    echo "=================================================================="
    ( "$@" ) || echo "WARN: $* failed (exit $?) — continuing"
  }

  should_run() {
    [ -z "${RUN_ONLY}" ] || [[ " ${RUN_ONLY} " == *" $1 "* ]]
  }

  # --- microbenchmarks (docs/benchmarks.md tables 1, 2, 3, 5, 6, 8, 10) -------
  should_run forward         && run python benchmarks/bench_forward.py          --outdir "$OUT"
  should_run inference_edge  && run python benchmarks/bench_inference_edge.py   --outdir "$OUT"
  should_run normalize       && run python benchmarks/bench_normalize.py        --outdir "$OUT"
  should_run backward_method && run python benchmarks/bench_backward_method.py  --outdir "$OUT"
  should_run lateon          && run python benchmarks/bench_lateon.py           --outdir "$OUT"
  should_run cached_maxsim   && run python benchmarks/bench_cached_maxsim.py    --outdir "$OUT" --variants all
  should_run flash_maxsim    && run python benchmarks/bench_flash_maxsim.py     --outdir "$OUT"

  # --- FP8 + fused head (both now write JSON + MD alongside the log) ---------
  should_run fp8              && run python benchmarks/bench_fp8.py              --outdir "$OUT" 2>&1 | tee "$OUT/fp8.log"
  should_run fused_head_train && run python benchmarks/bench_fused_head_train.py --outdir "$OUT" 2>&1 | tee "$OUT/fused_head_train.log"

  # --- end-to-end PyLate Contrastive sweep (table 9) -------------------------
  if should_run pylate_training; then
    for bs_neg in "64 1" "128 2" "256 3"; do
      set -- $bs_neg
      bs=$1; neg=$2
      run python benchmarks/bench_pylate_training.py \
          --batch-size $bs --neg $neg --lq 32 --ld 200 --d 128 \
          2>&1 | tee "$OUT/pylate_training_bs${bs}_neg${neg}.log"
    done
  fi

  # --- end-to-end LateOn-Code-edge training (table 7) ------------------------
  if should_run pylate_lateon; then
    for shape in "256 256" "192 512" "128 1024" "64 2048"; do
      set -- $shape
      bs=$1; ld=$2
      run python benchmarks/bench_pylate_lateon.py \
          --model lightonai/LateOn-Code-edge \
          --recipe contrastive \
          --batch-size $bs --Lq 32 --Ld $ld \
          --iters 8 --warmup 2 --outdir "$OUT" \
          2>&1 | tee "$OUT/lateon_edge_bs${bs}_ld${ld}.log"
    done
  fi

  # --- PLAID decompress + maxsim (memory/perf table in PLAID section) --------
  should_run decompress_maxsim && run python benchmarks/bench_decompress_maxsim.py --nbits 2 --dtype bf16 --outdir "$OUT" \
      2>&1 | tee "$OUT/decompress_nb2_bf16.log"

  # --- end-to-end fast-plaid comparison (PLAID main table) -------------------
  should_run fastplaid_e2e && run python benchmarks/bench_fastplaid_e2e.py --outdir "$OUT" \
      2>&1 | tee "$OUT/fastplaid_e2e.log"

  # --- LateOn-Code-edge real-data training (real MS MARCO table) -------------
  if should_run pylate_realdata; then
    run python benchmarks/bench_pylate_realdata.py \
        --model lightonai/LateOn-Code-edge \
        --recipe contrastive \
        --batch-size 16 --Lq 32 --Ld 256 \
        --steps 20 --warmup 3 --outdir "$OUT" \
        2>&1 | tee "$OUT/realdata_contrastive_bs16_ld256.log"

    run python benchmarks/bench_pylate_realdata.py \
        --model lightonai/LateOn-Code-edge \
        --recipe reason \
        --batch-size 64 --mini-batch-size 16 --Lq 32 --Ld 300 \
        --steps 12 --warmup 3 --grad-checkpoint --outdir "$OUT" \
        2>&1 | tee "$OUT/realdata_cached_bs64_ld300.log"

    run python benchmarks/bench_pylate_realdata.py \
        --model lightonai/LateOn-Code-edge \
        --recipe reason \
        --batch-size 128 --mini-batch-size 16 --Lq 32 --Ld 512 \
        --steps 8 --warmup 2 --grad-checkpoint --outdir "$OUT" \
        2>&1 | tee "$OUT/realdata_cached_bs128_ld512.log"
  fi

  echo ""
  echo "=== artifacts ==="
  ls -la "$OUT"
  tar -czf /tmp/bench_artifacts.tgz -C /tmp bench
  ls -la /tmp/bench_artifacts.tgz
