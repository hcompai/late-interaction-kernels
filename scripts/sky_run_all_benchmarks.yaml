# Run every benchmark behind docs/benchmarks.md on a single 1×H100 cluster
# (~25 min wall-clock). Tars the result directory back to the controller
# for download.
#
#   sky launch -c lik-bench-all scripts/sky_run_all_benchmarks.yaml -y
#   sky logs lik-bench-all
#   sky down lik-bench-all -y
#
# Skipped sections (kept as-is in docs):
#   * Apple Silicon (MPS) — needs an Apple device, not H100.
#   * 8-GPU DDP cached-contrastive — single-cluster budget.
#   * ColQwen2 e2e training — needs the out-of-band colpali-engine install;
#     run scripts/sky_colpali_e2e.yaml instead.

name: lik-bench-all

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
  # Space-separated subset of bench tags to run; empty means "run all".
  # Tags: forward, inference_edge, normalize, backward_method, longdoc,
  #       cached_maxsim, flash_maxsim, fp8, fused_head_train,
  #       decompress_maxsim, fastplaid_e2e.
  # Smoke-test the README numbers with:
  #   sky launch --env RUN_ONLY="forward cached_maxsim fused_head_train fp8" ...
  RUN_ONLY: ""

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda --extra pylate
  # Pinned baseline (docs/benchmarks.md "Baseline package versions");
  # patch_pylate() supports both the 1.3 and 1.5 score-module layouts.
  uv pip install "pylate==1.5.0"
  # Optional baselines; failure to install is non-fatal — each bench probes
  # via `import` and skips itself if the dep is missing.
  uv pip install "flash-maxsim==0.2.1" || true
  uv pip install "fast-plaid==1.4.6.280" || true

run: |
  set -uxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  source .venv/bin/activate
  export LIK_SUPPRESS_NORM_WARN=1

  python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__)"

  OUT=/tmp/bench
  mkdir -p "$OUT"

  run() {
    echo ""
    echo "=================================================================="
    echo "Running: $*"
    echo "=================================================================="
    ( "$@" ) || echo "WARN: $* failed (exit $?) — continuing"
  }

  should_run() {
    [ -z "${RUN_ONLY}" ] || [[ " ${RUN_ONLY} " == *" $1 "* ]]
  }

  # --- microbenchmarks (docs/benchmarks.md tables 1, 2, 3, 5, 6, 8, 10) -------
  should_run forward         && run python benchmarks/kernels/bench_forward.py         --outdir "$OUT"
  should_run inference_edge  && run python benchmarks/kernels/bench_inference_edge.py  --outdir "$OUT"
  should_run normalize       && run python benchmarks/kernels/bench_normalize.py       --outdir "$OUT"
  should_run backward_method && run python benchmarks/kernels/bench_backward_method.py --outdir "$OUT"
  should_run longdoc         && run python benchmarks/kernels/bench_longdoc.py         --outdir "$OUT"
  should_run cached_maxsim   && run python benchmarks/pylate/bench_cached_maxsim.py    --outdir "$OUT" --variants all
  should_run flash_maxsim    && run python benchmarks/kernels/bench_flash_maxsim.py    --outdir "$OUT"

  # --- FP8 + fused head (both now write JSON + MD alongside the log) ---------
  should_run fp8              && run python benchmarks/kernels/bench_fp8.py              --outdir "$OUT" 2>&1 | tee "$OUT/fp8.log"
  should_run fused_head_train && run python benchmarks/kernels/bench_fused_head_train.py --outdir "$OUT" 2>&1 | tee "$OUT/fused_head_train.log"

  # --- PLAID decompress + maxsim (memory/perf table in PLAID section) --------
  should_run decompress_maxsim && run python benchmarks/plaid/bench_decompress_maxsim.py --nbits 2 --dtype bf16 --outdir "$OUT" \
      2>&1 | tee "$OUT/decompress_nb2_bf16.log"

  # --- end-to-end fast-plaid comparison (PLAID main table) -------------------
  should_run fastplaid_e2e && run python benchmarks/plaid/bench_fastplaid_e2e.py --outdir "$OUT" \
      2>&1 | tee "$OUT/fastplaid_e2e.log"

  echo ""
  echo "=== artifacts ==="
  ls -la "$OUT"
  tar -czf /tmp/bench_artifacts.tgz -C /tmp bench
  ls -la /tmp/bench_artifacts.tgz
