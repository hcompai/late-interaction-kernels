# Full benchmark sweep on 1×H100. Wraps scripts/run_all_benchmarks.sh and
# tars the result directory back to the controller.
#
#   sky launch -c lik-bench-all scripts/sky_run_all_benchmarks.yaml -y
#   sky logs lik-bench-all
#   sky down lik-bench-all -y

name: lik-bench-all

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda --extra pylate
  # pylate 1.5+ broke patch_pylate's `(queries_mask, documents_mask)` signature.
  uv pip install "pylate==1.3.3"
  # Optional baselines for the head-to-head benches. Failure to install
  # either is non-fatal — run_all_benchmarks.sh probes via `import` and
  # skips the relevant bench.
  uv pip install "flash-maxsim==0.2.0" || true
  uv pip install "fast-plaid==1.4.6.280" || true

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  uv run python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__)"
  # Re-export PATH inside run_all_benchmarks.sh's subshells. The script
  # invokes `python` directly, so activate the uv-managed venv up-front.
  source .venv/bin/activate
  OUTDIR=/tmp/bench bash scripts/run_all_benchmarks.sh 2>&1 | tee /tmp/bench_run.log
  echo "=== artifacts ==="
  ls -la /tmp/bench
  tar -czf /tmp/bench_artifacts.tgz -C /tmp bench bench_run.log
  ls -la /tmp/bench_artifacts.tgz
