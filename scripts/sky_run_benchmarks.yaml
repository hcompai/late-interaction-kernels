# One-shot benchmark run on 1×H100. Tests live in GitHub Actions (gpu-ci.yml).
#   sky jobs launch scripts/sky_run_benchmarks.yaml

name: late-interaction-kernels-bench

resources:
  infra: kubernetes
  image_id: docker:nvcr.io/nvidia/pytorch:25.06-py3
  accelerators: H100:1
  cpus: 16+

workdir: .

config:
  kubernetes:
    pod_config:
      spec:
        priorityClassName: low

setup: |
  set -eux
  cd ~/sky_workdir
  pip install --no-cache-dir -e ".[dev,pylate]" || pip install --no-cache-dir -e ".[dev]"

run: |
  set -eux
  cd ~/sky_workdir
  python -c "import torch; print(torch.cuda.get_device_name())"
  python benchmarks/bench_forward.py --outdir /tmp/bench
  python benchmarks/bench_backward_method.py --outdir /tmp/bench
  ls -la /tmp/bench
