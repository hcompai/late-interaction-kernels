# 8×H100 single-node dev box for late-interaction-kernels.
#   sky launch -c late-interaction-kernels-dev scripts/sky_dev.yaml
#
# Afterwards:
#   sky ssh late-interaction-kernels-dev
#   sky stop late-interaction-kernels-dev   # keep cluster but idle
#   sky down late-interaction-kernels-dev   # tear down

name: late-interaction-kernels-dev

resources:
  infra: kubernetes
  image_id: docker:nvcr.io/nvidia/pytorch:25.06-py3
  accelerators: H100:8
  cpus: 32+

file_mounts:
  /s3/hai-research:
    source: s3://hai-research/
    mode: MOUNT_CACHED

workdir: .

config:
  kubernetes:
    pod_config:
      spec:
        priorityClassName: low

setup: |
  set -eux
  cd ~/sky_workdir
  pip install --no-cache-dir -e ".[dev,pylate]" || pip install --no-cache-dir -e ".[dev]"
  python -c "import torch, triton; print('torch', torch.__version__, 'triton', triton.__version__); print(torch.cuda.get_device_name())"

run: |
  echo "Ready on $(hostname). Ssh in and run: pytest tests/ -v"
