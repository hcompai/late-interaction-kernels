# 8×H100 single-node dev box for flash-colbert.
#   sky launch -c flash-colbert-dev scripts/sky_dev.yaml
#
# Afterwards:
#   sky ssh flash-colbert-dev
#   sky stop flash-colbert-dev   # keep cluster but idle
#   sky down flash-colbert-dev   # tear down

name: flash-colbert-dev

resources:
  infra: kubernetes
  image_id: docker:nvcr.io/nvidia/pytorch:25.06-py3
  accelerators: H100:8
  cpus: 32+

file_mounts:
  /s3/hai-research:
    source: s3://hai-research/
    mode: MOUNT_CACHED

workdir: .

config:
  kubernetes:
    pod_config:
      spec:
        priorityClassName: low

setup: |
  set -eux
  cd ~/sky_workdir
  pip install --no-cache-dir -e ".[dev,bench,pylate]" || pip install --no-cache-dir -e ".[dev,bench]"
  python -c "import torch, triton; print('torch', torch.__version__, 'triton', triton.__version__); print(torch.cuda.get_device_name())"

run: |
  echo "Ready on $(hostname). Ssh in and run: pytest tests/ -v"
