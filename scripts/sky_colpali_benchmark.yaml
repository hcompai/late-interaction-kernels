# E2E ColQwen2 training benchmark via colpali_engine: synthetic + real DocVQA.
#
#   sky launch scripts/sky_colpali_benchmark.yaml -c lik-colpali-benchmark -y
#
# Compares vanilla colpali_engine vs patch_colpali_engine() driving a real
# ColQwen2-v1.0 forward + backward through ColbertLoss / ColbertPairwiseCELoss /
# ColbertSigmoidLoss. Two scripts:
#
#   * benchmarks/bench_colpali_training.py  — synthetic PIL images + fake queries
#   * benchmarks/bench_colpali_realdata.py  — vidore/docvqa_test_subsampled
#     (a few hundred real document images + OCR-targeted queries)

name: lik-colpali-benchmark

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
  # Space-separated subset of config tags to run; empty means "run all".
  # Tags below: synth-colbert-bs4, synth-colbert-bs8-ckpt, synth-pairwise-bs4,
  #             synth-colbert-neg-bs4, synth-pairwise-neg-bs4,
  #             real-colbert-bs4, real-colbert-bs8-ckpt
  # Override with: sky launch --env RUN_ONLY="synth-colbert-bs4 real-colbert-bs4" ...
  RUN_ONLY: ""

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda
  # colpali-engine is not in the project's optional extras; install it
  # directly. 0.3.10 is the first release with the patched-API surface
  # (ColbertLoss / ColbertPairwiseCELoss / ColbertSigmoidLoss + the
  # processing_utils.BaseVisualRetrieverProcessor.score_multi_vector helper).
  # Install colpali-engine, pinning torch+torchvision to cu128 builds.
  # The cu124 pytorch index serves torch 2.8.0+cu128 as its latest wheel.
  # We must use the matching torchvision 0.26.0+cu128 (from the cu128 index)
  # so the torchvision C++ extension ABI matches torch and loads correctly.
  # PyPI torchvision 0.26.0 requires libcudart.so.13 (CUDA 13) and won't
  # load on this CUDA 12.9 container, but the +cu128 build uses
  # libcudart.so.12 (CUDA 12.8), which the container provides.
  uv pip install "colpali-engine>=0.3.10" datasets pillow triton \
      "torch==2.11.0+cu128" "torchvision==0.26.0+cu128" \
      --extra-index-url https://download.pytorch.org/whl/cu128
  # torchvision 0.26.0+cu128: the _C.so is compiled against PyPI torch (CUDA 13
  # ABI), not torch +cu128, so it fails to load with "undefined symbol".
  # torchvision.transforms.v2 (what ColQwen2 actually uses) is pure Python
  # and doesn't need _C.so. Only _meta_registrations.py fails because it
  # tries to register fake NMS ops via the missing C++ extension.
  # Patch __init__.py to make that import optional so torchvision loads fine.
  uv run python - << 'PYEOF'
  import glob
  tv_init = glob.glob(
      "/root/sky_workdir/.venv/lib/python3.10/site-packages/torchvision/__init__.py"
  )[0]
  with open(tv_init) as f:
      src = f.read()
  old = (
      "from torchvision import _meta_registrations, datasets, io, models, "
      "ops, transforms, utils  # usort:skip"
  )
  new = (
      "from torchvision import datasets, io, models, ops, transforms, utils  # usort:skip\n"
      "try:\n"
      "    from torchvision import _meta_registrations  # noqa: F401\n"
      "except Exception:\n"
      "    pass  # _C.so ABI mismatch: NMS meta registration unavailable"
  )
  if old in src:
      with open(tv_init, "w") as f:
          f.write(src.replace(old, new, 1))
      print("patched torchvision/__init__.py: _meta_registrations import is optional")
  else:
      print("WARNING: expected __init__.py line not found — torchvision version differs")
  PYEOF
  # Optional: flash-attn for the ColQwen2 attention path. Skip if it fails to
  # build — the bench falls back to torch SDPA automatically.
  uv pip install flash-attn --no-build-isolation || true
  # Sanity check the model + processor + loss patcher can all hydrate.
  # Uses the same torchvision mock as the bench scripts (ColQwen2 uses
  # qwen_vl_utils, not torchvision; the mock just satisfies transformers).
  uv run python -c "
  import torch
  from colpali_engine.models import ColQwen2, ColQwen2Processor
  from colpali_engine.loss.late_interaction_losses import ColbertLoss
  from late_interaction_kernels import patch_colpali_engine, unpatch_colpali_engine
  print('gpu', torch.cuda.get_device_name())
  print('torch', torch.__version__, 'cuda', torch.version.cuda)
  proc = ColQwen2Processor.from_pretrained('vidore/colqwen2-v1.0')
  print('processor ok', type(proc).__name__)
  patch_colpali_engine(); unpatch_colpali_engine()
  print('patcher ok')
  "

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  export LIK_SUPPRESS_NORM_WARN=1
  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  ART=/tmp/colpali_training_${STAMP}
  mkdir -p "${ART}"

  MODEL="vidore/colqwen2-v1.0"

  # Tag filter: empty RUN_ONLY means run everything; otherwise only the
  # space-separated tags in RUN_ONLY are executed. Each config block is
  # wrapped in `should_run TAG && ( ... )` so subsets are cheap.
  should_run() {
    [ -z "${RUN_ONLY}" ] || [[ " ${RUN_ONLY} " == *" $1 "* ]]
  }

  should_run synth-colbert-bs4 && (
    echo "=============================================================="
    echo "  Synthetic ColQwen2 — ColbertLoss bs=4"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_training.py \
        --model "${MODEL}" \
        --loss colbert \
        --batch-size 4 --image-size 448 --query-words 16 \
        --iters 10 --warmup 2 \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/synth_colbert_bs4.log"
  )

  should_run synth-colbert-bs8-ckpt && (
    echo "=============================================================="
    echo "  Synthetic ColQwen2 — ColbertLoss bs=8 + grad ckpt"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_training.py \
        --model "${MODEL}" \
        --loss colbert \
        --batch-size 8 --image-size 448 --query-words 16 \
        --iters 10 --warmup 2 \
        --grad-checkpoint \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/synth_colbert_bs8_ckpt.log"
  )

  should_run synth-pairwise-bs4 && (
    echo "=============================================================="
    echo "  Synthetic ColQwen2 — ColbertPairwiseCELoss bs=4"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_training.py \
        --model "${MODEL}" \
        --loss pairwise_ce \
        --batch-size 4 --image-size 448 --query-words 16 \
        --iters 10 --warmup 2 \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/synth_pairwise_bs4.log"
  )

  should_run synth-colbert-neg-bs4 && (
    echo "=============================================================="
    echo "  Synthetic ColQwen2 — ColbertNegativeCELoss bs=4, num_neg=4"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_training.py \
        --model "${MODEL}" \
        --loss colbert_neg --num-neg 4 \
        --batch-size 4 --image-size 448 --query-words 16 \
        --iters 10 --warmup 2 \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/synth_colbert_neg_bs4.log"
  )

  should_run synth-pairwise-neg-bs4 && (
    echo "=============================================================="
    echo "  Synthetic ColQwen2 — ColbertPairwiseNegativeCELoss bs=4, num_neg=4"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_training.py \
        --model "${MODEL}" \
        --loss pairwise_neg --num-neg 4 \
        --batch-size 4 --image-size 448 --query-words 16 \
        --iters 10 --warmup 2 \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/synth_pairwise_neg_bs4.log"
  )

  should_run real-colbert-bs4 && (
    echo "=============================================================="
    echo "  Real DocVQA — ColbertLoss bs=4"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_realdata.py \
        --model "${MODEL}" \
        --loss colbert \
        --batch-size 4 --max-samples 64 \
        --steps 10 --warmup 2 \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/real_colbert_bs4.log"
  )

  should_run real-colbert-bs8-ckpt && (
    echo "=============================================================="
    echo "  Real DocVQA — ColbertLoss bs=8 + grad ckpt"
    echo "=============================================================="
    uv run python benchmarks/bench_colpali_realdata.py \
        --model "${MODEL}" \
        --loss colbert \
        --batch-size 8 --max-samples 96 \
        --steps 10 --warmup 2 \
        --grad-checkpoint \
        --outdir "${ART}" \
        2>&1 | tee "${ART}/real_colbert_bs8_ckpt.log"
  )

  echo "Artifacts: ${ART}"
  ls -la "${ART}"
