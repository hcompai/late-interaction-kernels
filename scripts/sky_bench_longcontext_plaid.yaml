# Re-verify long-context (Ld up to 16k) and PLAID end-to-end numbers
# with the v0.2.x kernel + the fp32-accumulator parity check.
#
#   sky launch -c lik-bench-lc scripts/sky_bench_longcontext_plaid.yaml -y
#   sky logs lik-bench-lc
#   sky down lik-bench-lc -y

name: lik-bench-lc

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 8+

config:
  kubernetes:
    pod_config:
      spec:
        priorityClassName: low

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda
  # fast-plaid ships per-torch-version wheels; 1.4.6.280 is the torch-2.8 one.
  # If this fails to link against the uv-resolved torch ABI (the NGC image used
  # to break it the other way), swap to a matched torch with `uv pip install torch==X`.
  uv pip install "fast-plaid==1.4.6.280"
  uv run python -c "import torch, triton, fast_plaid, late_interaction_kernels; print('torch', torch.__version__, 'triton', triton.__version__)"

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  mkdir -p /tmp/bench

  uv run python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__)"

  echo "=== bench_longdoc (long-context Ld ∈ {300, 2k, 4k, 8k, 16k}) ==="
  uv run python benchmarks/kernels/bench_longdoc.py --outdir /tmp/bench 2>&1 | tee /tmp/bench/longdoc.log

  echo "=== bench_fastplaid_e2e (engine.search vs LIK varlen + top-k) ==="
  uv run python benchmarks/plaid/bench_fastplaid_e2e.py --outdir /tmp/bench --small 2>&1 | tee /tmp/bench/plaid.log

  echo "=== artifacts ==="
  ls -la /tmp/bench
  cat /tmp/bench/lateon_*.json | uv run python -m json.tool || true
  cat /tmp/bench/fastplaid_e2e_*.json | uv run python -m json.tool || true
