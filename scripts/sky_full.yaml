# Full one-shot validation + benchmark run on 1×H100.
#   sky jobs launch scripts/sky_full.yaml
#
# Runs the whole pytest suite and every benchmark, writing artifacts to
# /artifacts on the pod (and the mounted S3 bucket if available).

name: lik-full

resources:
  infra: kubernetes
  image_id: docker:nvcr.io/nvidia/pytorch:25.06-py3
  accelerators: H100:1
  cpus: 16+

file_mounts:
  /s3/hai-research:
    source: s3://hai-research/
    mode: MOUNT_CACHED

workdir: .

config:
  kubernetes:
    pod_config:
      spec:
        priorityClassName: low

setup: |
  set -eux
  cd ~/sky_workdir
  pip install --no-cache-dir -e ".[dev,pylate]" || pip install --no-cache-dir -e ".[dev]"
  # FastPlaid is optional — only attempt to install if cargo is present.
  if command -v cargo >/dev/null 2>&1; then
    pip install --no-cache-dir fast-plaid || echo "WARN: fast-plaid wheel missing"
  else
    pip install --no-cache-dir fast-plaid 2>/dev/null || echo "INFO: fast-plaid not installed (no cargo)"
  fi
  python -c "import torch, triton; print('torch', torch.__version__, 'triton', triton.__version__); print(torch.cuda.get_device_name())"

run: |
  set -eux
  cd ~/sky_workdir

  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  GPU=$(python -c "import torch; print(torch.cuda.get_device_name(0).replace(' ', '_'))")
  ART=/artifacts/${STAMP}_${GPU}
  mkdir -p "${ART}"

  echo ">>> pytest"
  pytest tests/ -v --durations=30 --junitxml="${ART}/tests.xml" 2>&1 | tee "${ART}/tests.log"

  echo ">>> benchmarks"
  OUTDIR="${ART}/bench" bash scripts/run_all_benchmarks.sh 2>&1 | tee "${ART}/bench.log"

  echo ">>> artifacts"
  find "${ART}" -type f | sort

  # Copy to S3 if the mount is up.
  if [ -d /s3/hai-research ]; then
    DEST=/s3/hai-research/late-interaction-kernels/${STAMP}_${GPU}
    mkdir -p "${DEST}"
    cp -R "${ART}"/. "${DEST}/" || echo "WARN: S3 copy failed"
    echo "Uploaded to ${DEST}"
  fi
