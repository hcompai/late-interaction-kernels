# Reproduces the variable-Lq autotune stall (Tony's PyLate end-to-end issue)
# on a fresh H100, BEFORE and AFTER the bucketing patch on the same node.
#
# Usage:
#   sky launch -c lik-lq-bench scripts/sky_bench_lq_autotune.yaml -y

resources:
  accelerators: H100:1
  cloud: aws
  use_spot: true
  image_id: docker:nvcr.io/nvidia/pytorch:25.06-py3

workdir: .

setup: |
  set -eux
  pip install --break-system-packages triton==3.4.0 || true
  pip install --break-system-packages --upgrade pip

run: |
  set -eux
  cd ~/sky_workdir
  nvidia-smi | head -25

  echo
  echo "=========================================================="
  echo "BEFORE — main (v0.2.0 from PyPI, no bucketing)"
  echo "=========================================================="
  pip install --break-system-packages "late-interaction-kernels==0.2.0"
  python scripts/_bench_lq_autotune.py

  echo
  echo "=========================================================="
  echo "AFTER — perf/bucket-lq-autotune (HEAD)"
  echo "=========================================================="
  pip uninstall -y --break-system-packages late-interaction-kernels
  export SETUPTOOLS_SCM_PRETEND_VERSION=0.2.1
  pip install --break-system-packages -e . --no-deps
  python scripts/_bench_lq_autotune.py
