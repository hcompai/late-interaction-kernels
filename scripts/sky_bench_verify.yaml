# Verify the headline README benchmark numbers on a fresh H100.
# Adds torch.compile baselines on top of the existing naive einsum / vanilla
# pylate baselines so the speedup ratios are fair.
#
#   sky launch -c lik-bench-verify scripts/sky_bench_verify.yaml -y
#   sky logs lik-bench-verify
#   sky down lik-bench-verify -y

name: lik-bench-verify

resources:
  infra: kubernetes
  image_id: docker:nvcr.io/nvidia/pytorch:25.06-py3
  accelerators: H100:1
  cpus: 16+

workdir: .

setup: |
  set -eux
  cd ~/sky_workdir
  # NGC image is Debian-managed (PEP 668) — use --break-system-packages.
  pip install -e ".[dev,pylate]" --no-deps --break-system-packages
  # pylate >=1.5 broke patch_pylate; pin to 1.3.4 and install minimum deps
  # so import + colbert_scores work for the cached-maxsim bench.
  pip install "pylate==1.3.4" --no-deps --break-system-packages
  pip install "sentence-transformers==5.1.1" "transformers>=4.41,<=4.56.2" \
              accelerate datasets pandas tokenizers --break-system-packages

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  mkdir -p /tmp/bench

  python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__)"

  echo "=== bench_forward (naive + same-dtype + torch.compile) ==="
  python benchmarks/bench_forward.py --outdir /tmp/bench --dtype bf16 2>&1 | tee /tmp/bench/forward.log

  echo "=== bench_cached_maxsim (vanilla pylate + torch.compile + LIK) ==="
  python benchmarks/bench_cached_maxsim.py --outdir /tmp/bench --only all 2>&1 | tee /tmp/bench/cached.log

  echo "=== bench_fused_head_train (fused_head vs F.linear+normalize+maxsim — both with LIK maxsim) ==="
  python benchmarks/bench_fused_head_train.py 2>&1 | tee /tmp/bench/fused_head.log || true

  echo "=== bench_fp8 (maxsim_inference_fp8 vs maxsim bf16 — both LIK) ==="
  python benchmarks/bench_fp8.py 2>&1 | tee /tmp/bench/fp8.log || true

  echo "=== artifacts ==="
  ls -la /tmp/bench
  cat /tmp/bench/forward_*_bf16.md 2>/dev/null || true
  cat /tmp/bench/cached_maxsim_*.json 2>/dev/null | python -m json.tool || true
