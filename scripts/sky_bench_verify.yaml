# Verify the headline README benchmark numbers on a fresh H100.
# Adds torch.compile baselines on top of the existing naive einsum / vanilla
# pylate baselines so the speedup ratios are fair.
#
#   sky launch -c lik-bench-verify scripts/sky_bench_verify.yaml -y
#   sky logs lik-bench-verify
#   sky down lik-bench-verify -y

name: lik-bench-verify

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.9.2-runtime-ubuntu24.04
  accelerators: H100:1
  cpus: 16+

workdir: .

envs:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update -y
  apt-get install -y --no-install-recommends curl ca-certificates
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen --extra dev --extra torch-cuda --extra pylate
  # pylate 1.5+ broke patch_pylate's `(queries_mask, documents_mask)`
  # signature; pin to the last working release.
  uv pip install "pylate==1.3.3"

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$PATH"
  mkdir -p /tmp/bench

  uv run python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__)"

  echo "=== bench_forward (naive + same-dtype + torch.compile) ==="
  uv run python benchmarks/bench_forward.py --outdir /tmp/bench --dtype bf16 2>&1 | tee /tmp/bench/forward.log

  echo "=== bench_cached_maxsim (vanilla pylate + torch.compile + LIK) ==="
  uv run python benchmarks/bench_cached_maxsim.py --outdir /tmp/bench --variants all 2>&1 | tee /tmp/bench/cached.log

  echo "=== bench_fused_head_train (fused_head vs F.linear+normalize+maxsim — both with LIK maxsim) ==="
  uv run python benchmarks/bench_fused_head_train.py 2>&1 | tee /tmp/bench/fused_head.log || true

  echo "=== bench_fp8 (maxsim_inference_fp8 vs maxsim bf16 — both LIK) ==="
  uv run python benchmarks/bench_fp8.py 2>&1 | tee /tmp/bench/fp8.log || true

  echo "=== artifacts ==="
  ls -la /tmp/bench
