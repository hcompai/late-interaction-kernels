name: bench three-way (manual)

# Manual-dispatch-only. One-off three-way MaxSim forward bench
# (LIK vs flash-maxsim vs erikkaum/maxsim) on the existing self-hosted
# GPU CI runner. No automatic triggers; gates no PR. Internal tool for
# spot-checking how LIK fares on the runner's GPU (currently a
# Tesla T4 — Turing sm_75) against other published kernels.
#
# Trigger:
#
#     gh workflow run "bench three-way (manual)" --ref <some-branch>
#
# The runner has no bf16 tensor cores (T4 is Turing), so we benchmark
# in fp16 only. The bench script asserts numerical parity against the
# eager fp32-accumulator reference before timing each kernel.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  bench:
    name: three-way bench on the CI GPU runner
    runs-on: late-interaction-kernels-runner
    container:
      image: nvcr.io/nvidia/pytorch:25.06-py3
      options: --gpus all --ipc=host
    env:
      LIK_SUPPRESS_NORM_WARN: "1"
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.2.2"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: GPU + software identity
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,driver_version,memory.total,clocks.current.sm,clocks.current.memory,compute_cap --format=csv
          python -c "import torch; print('torch:', torch.__version__); print('cuda:', torch.version.cuda, 'device:', torch.cuda.get_device_name(0)); print('cap:', torch.cuda.get_device_capability(0))"
          python -c "import triton; print('triton:', triton.__version__)"

      - name: Install LIK + flash-maxsim + kernels-hub
        # NGC image is Debian-managed (PEP 668); install with the override.
        # Each external package is best-effort: if a wheel is missing for
        # this arch/torch combo, the bench skips that kernel and continues.
        run: |
          pip install --no-cache-dir -e ".[dev]" --break-system-packages
          pip install --no-cache-dir "flash-maxsim==0.2.0" --break-system-packages || true
          pip install --no-cache-dir "kernels>=0.6" --break-system-packages || true
          pip install --no-cache-dir numpy einops --break-system-packages

      - name: Run three-way bench (fp16)
        run: |
          mkdir -p /tmp/bench
          python benchmarks/bench_three_way.py --outdir /tmp/bench --dtype fp16 2>&1 | tee /tmp/bench/three_way_fp16.log
          echo "----- artefacts -----"
          ls -la /tmp/bench
          echo "----- markdown report -----"
          cat /tmp/bench/three_way_*.md 2>/dev/null || true

      - name: Upload bench artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-way-fp16
          path: /tmp/bench/
          if-no-files-found: warn
          retention-days: 7
