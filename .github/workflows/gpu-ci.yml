name: GPU CI

permissions:
  contents: read

# Runs the CUDA-marked tests on an AWS CodeBuild-hosted GPU runner (A10G).
# Triggered:
#   - on PRs carrying the `run-gpu-tests` label, when GPU-relevant code changed
#     (label apply requires triage+);
#   - manually via workflow_dispatch — launch from
#     https://github.com/hcompai/late-interaction-kernels/actions/workflows/gpu-ci.yml
#     (no automatic run on pushes to main, to keep CodeBuild spend predictable).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "late_interaction_kernels/**"
      - "torch-ext/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gpu-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: GPU tests
    # A10G (g5-class), ~$0.05/min — https://aws.amazon.com/codebuild/pricing/
    runs-on: codebuild-late-interaction-kernels-${{ github.run_id }}-${{ github.run_attempt }}-linux-5.0-gpu_small
    # On PRs, only when the `run-gpu-tests` label is attached (so new commits
    # on a labeled PR also re-run). Label apply requires triage+ — every
    # current collaborator on this repo has that, so the gate is effectively
    # "any internal collaborator can trigger." Manual workflow_dispatch runs
    # always pass.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-gpu-tests')
    # Silence the unnormalized-input warning: many parity tests deliberately
    # feed unnormalized vectors, so the warning is expected noise here.
    # TRITON_CACHE_DIR pins the autotune disk cache to a stable path so the
    # actions/cache step below can save and restore it across runs.
    env:
      LIK_SUPPRESS_NORM_WARN: "1"
      TRITON_CACHE_DIR: ${{ github.workspace }}/.triton-cache
    # 60 min covers a cold-cache first run on an ephemeral CodeBuild box;
    # subsequent runs hit the restored Triton autotune cache and finish much
    # faster.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        # `torch-cuda` extra pulls the cu124 wheel from the pytorch index
        # defined in pyproject.toml. pylate's dep tree can conflict with
        # CUDA torch, so we skip the pylate extra here; pylate parity tests
        # auto-skip when the import fails.
        run: uv sync --frozen --extra dev --extra torch-cuda

      - name: GPU sanity check
        run: |
          nvidia-smi
          uv run python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"

      - name: Restore Triton autotune cache
        # Triton 3.4+ persists best-config picks on disk; caching the dir
        # across CI runs skips the multi-minute autotune sweep that was
        # blowing past the 30-min budget on ephemeral CodeBuild runners.
        # The cache is keyed on kernel sources + lockfile so any change
        # that would invalidate a Triton cache entry also rotates the key.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.triton-cache
          key: triton-autotune-${{ runner.os }}-${{ hashFiles('late_interaction_kernels/**/*.py', 'uv.lock') }}
          restore-keys: |
            triton-autotune-${{ runner.os }}-

      - name: Run tests
        # Single bucket — CodeBuild's ephemeral runner makes per-job overhead
        # the long pole, so parallelizing across buckets isn't worth the
        # maintenance cost of keeping file lists in sync. MPS-only and
        # CPU-reference tests auto-skip on the A10G via their own gating.
        # `--durations=20` keeps slow-test visibility for occasional triage.
        run: uv run pytest tests/ -v --durations=20
