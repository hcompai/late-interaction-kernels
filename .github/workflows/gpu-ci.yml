name: GPU CI

permissions:
  contents: read

# Runs the CUDA-marked tests on a GitHub-hosted GPU larger runner. Triggered:
#   - automatically on push to main and on PRs that touch kernel-related files;
#   - manually via `workflow_dispatch` (requires write permission on the repo);
#   - on PRs by adding the `run-gpu-ci` label (label apply requires triage+).
on:
  push:
    branches: [main]
    paths:
      - "late_interaction_kernels/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gpu-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "late_interaction_kernels/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gpu-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: GPU tests (CUDA)
    # GitHub-hosted GPU larger runner (Tesla T4, 4 vCPUs) — provisioned by
    # the org admin. Swap the label here if more GPU SKUs come online later.
    runs-on: gpu-t4-4-core
    # On `labeled` events, only fire when the gating label is applied. All
    # other events (push, synchronize, dispatch, etc.) skip this guard.
    if: github.event.action != 'labeled' || github.event.label.name == 'run-gpu-ci'
    # NVIDIA PyTorch image — CUDA torch is preinstalled, so we don't have to
    # fight the CPU-only torch pin in pyproject.toml (`[tool.uv.sources]`).
    # Mirrors scripts/sky_run_benchmarks.yaml setup. Docker is preinstalled
    # on GitHub-hosted larger runners.
    container:
      image: nvcr.io/nvidia/pytorch:25.06-py3
      options: --gpus all --ipc=host
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: GPU sanity check
        run: |
          nvidia-smi
          python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"

      - name: Install package
        # Prefer the full extras (pylate parity tests); fall back to dev-only
        # if pylate resolution fails on this image.
        run: |
          pip install --no-cache-dir -e ".[dev,pylate]" || pip install --no-cache-dir -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --durations=20 -m "not perf"

      - name: Run perf regression suite
        # Times each kernel and compares median latency against the baseline
        # JSON committed under benchmarks/baselines/{GPU}.json. Fails if any
        # kernel is more than 5 % slower than its baseline. Skips cleanly if
        # there is no baseline for this runner's GPU class — regenerate via
        # `pytest tests/regression/ -m perf --update-perf-baseline` and commit
        # the resulting file.
        run: pytest tests/regression/ -m perf -v --durations=10
