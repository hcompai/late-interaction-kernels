name: GPU CI

permissions:
  contents: read

# Runs the CUDA-marked tests on an AWS CodeBuild-hosted GPU runner (T4).
# Triggered:
#   - on commits to main that touch GPU-relevant code;
#   - on PRs carrying the `run-gpu-tests` label, when GPU-relevant code changed
#     (label apply requires triage+);
#   - manually via workflow_dispatch (e.g. to force a run on a docs-only PR).
on:
  push:
    branches: [main]
    paths:
      - "late_interaction_kernels/**"
      - "torch-ext/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gpu-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "late_interaction_kernels/**"
      - "torch-ext/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gpu-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: GPU tests (${{ matrix.bucket.name }})
    # T4, ~$0.05/min — https://aws.amazon.com/codebuild/pricing/
    runs-on: codebuild-late-interaction-kernels-${{ github.run_id }}-${{ github.run_attempt }}-linux-5.0-gpu_small
    # Run on every push to main; on PRs, only when the `run-gpu-tests` label
    # is attached (so new commits on a labeled PR also re-run). Label apply
    # requires triage+ — every current collaborator on this repo has that,
    # so the gate is effectively "any internal collaborator can trigger."
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-gpu-tests')
    # Silence the unnormalized-input warning: many parity tests deliberately
    # feed unnormalized vectors, so the warning is expected noise here.
    env:
      LIK_SUPPRESS_NORM_WARN: "1"
    timeout-minutes: 30
    strategy:
      # One bucket failing shouldn't cancel the others — we want to see all
      # failures in a single run rather than chase one at a time.
      fail-fast: false
      matrix:
        bucket:
          # Buckets sized roughly by post-trim per-file durations from the
          # single-shard run; rebalance via the --durations=20 output of
          # each shard when test additions shift the picture.
          - name: heavy-parity
            paths: >-
              tests/test_backward.py
              tests/test_backward_unified.py
              tests/test_normalize.py
              tests/test_robustness.py
              tests/test_fused_head_train.py
          - name: kernels-medium
            paths: >-
              tests/test_plaid.py
              tests/test_padded.py
              tests/test_fp8.py
              tests/test_compile_cache.py
              tests/test_smooth.py
              tests/test_fused_head.py
          - name: kernels-light
            paths: >-
              tests/test_forward.py
              tests/test_varlen.py
              tests/test_scatter.py
              tests/test_topk.py
              tests/test_soft.py
              tests/test_matryoshka.py
              tests/test_edge_cases.py
              tests/test_retrieve.py
              tests/test_pylate_compat.py
              tests/test_pylate_compat_warnings.py
              tests/test_colpali_compat.py
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        # `torch-cuda` extra pulls the cu124 wheel from the pytorch index
        # defined in pyproject.toml. pylate's dep tree can conflict with
        # CUDA torch, so we skip the pylate extra here; pylate parity tests
        # auto-skip when the import fails.
        run: uv sync --frozen --extra dev --extra torch-cuda

      - name: GPU sanity check
        run: |
          nvidia-smi
          uv run python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"

      - name: Run tests (${{ matrix.bucket.name }})
        # --durations=20 prints the long pole per bucket so we can rebalance
        # the matrix when test additions shift the picture.
        run: uv run pytest ${{ matrix.bucket.paths }} -v --durations=20
