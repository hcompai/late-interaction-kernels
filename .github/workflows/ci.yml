name: CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "late_interaction_kernels/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run ruff linter
        run: uv run ruff check
      - name: Run ruff formatter check
        run: uv run ruff format --check

  typecheck:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run ty type checker
        run: uv run ty check --output-format github

  cpu-smoke:
    name: CPU smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Import check
        run: |
          uv run --python ${{ matrix.python-version }} python -c "import late_interaction_kernels as lik; print(lik.__version__)"
          uv run --python ${{ matrix.python-version }} python -c "from late_interaction_kernels.reference import maxsim_reference, maxsim_reference_soft, maxsim_reference_varlen; print('reference ok')"
      - name: Run CPU-safe tests (CUDA tests auto-skip)
        run: uv run --python ${{ matrix.python-version }} pytest -q

  # GPU tests run on a GitHub-hosted GPU larger runner via gpu-ci.yml —
  # automatically on push to main and on kernel-touching PRs, manually via
  # workflow_dispatch, or by adding the `run-gpu-ci` label to an unrelated PR.
