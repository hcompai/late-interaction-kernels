name: CI

permissions:
  contents: read

# Lint + typecheck are cheap and always run on every PR and push to main.
# Path-gated test workflows live in cpu-ci.yml (CPU smoke) and gpu-ci.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra torch-cpu
      - name: Run ruff linter
        run: uv run ruff check
      - name: Run ruff formatter check
        run: uv run ruff format --check

  typecheck:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra torch-cpu
      - name: Run ty type checker
        run: uv run ty check --output-format github

  # CPU smoke tests run via cpu-ci.yml — on PRs and pushes to main, gated
  # to changes under late_interaction_kernels/**, tests/**, pyproject.toml,
  # uv.lock, or the workflow itself.
  #
  # GPU tests run on an AWS CodeBuild-hosted GPU runner (A10G) via gpu-ci.yml —
  # on pushes to main or PRs carrying the `run-gpu-tests` label, gated to
  # changes under late_interaction_kernels/**, torch-ext/**, tests/**,
  # pyproject.toml, uv.lock, or the workflow itself.
