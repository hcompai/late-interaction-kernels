name: Release to PyPI

# Triggers on a `vX.Y.Z` tag push. Builds an sdist + pure-Python wheel and
# uploads them to PyPI via OIDC trusted publishing — no token kept in
# repository secrets.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   - Project name      : late-interaction-kernels
#   - GitHub repo owner : hcompai
#   - GitHub repo name  : late-interaction-kernels
#   - Workflow filename : release.yml
#   - Environment       : pypi
#
# Manual run (e.g. to publish an already-pushed tag):
#   gh workflow run release.yml --ref v0.10.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to publish (e.g. v0.10.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          set -eux
          PYPROJECT_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          INIT_VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('late_interaction_kernels/__init__.py').read_text()).group(1))")
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          REF_VERSION="${REF#v}"
          echo "pyproject=${PYPROJECT_VERSION} init=${INIT_VERSION} tag=${REF_VERSION}"
          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::pyproject.toml ($PYPROJECT_VERSION) and __init__.py ($INIT_VERSION) disagree"
            exit 1
          fi
          if [ "$PYPROJECT_VERSION" != "$REF_VERSION" ]; then
            echo "::error::tag ($REF_VERSION) does not match package version ($PYPROJECT_VERSION)"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Inspect artefacts
        run: |
          ls -lh dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-trusted:
    name: Publish (PyPI Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/late-interaction-kernels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artefacts to the GitHub release
    needs: publish-trusted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -eux
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          VERSION="${REF#v}"
          awk -v v="^## ${VERSION}" '
            $0 ~ v {flag=1; print; next}
            /^## [0-9]/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release_notes.md
          echo "Release notes preview:"
          head -40 release_notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          if gh release view "$REF" >/dev/null 2>&1; then
            gh release upload "$REF" dist/* --clobber
          else
            gh release create "$REF" \
              --title "$REF" \
              --notes-file release_notes.md \
              dist/*
          fi
