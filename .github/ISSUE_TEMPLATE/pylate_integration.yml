name: PyLate integration issue
description: patch_pylate() misbehaves, wrong scores, Contrastive/Distillation loss diverges, etc.
labels: ["pylate", "integration"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — PyLate integration is our #1 use case, and we want to keep
        the drop-in clean. Please fill in the shape / env details below; a
        minimal reproducer that calls `patch_pylate()` + one loss step is
        almost always enough for us to repro locally.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence — what went wrong with PyLate + late-interaction-kernels?
    validations:
      required: true

  - type: input
    id: pylate_version
    attributes:
      label: PyLate version
      description: 'Output of `python -c "import pylate; print(pylate.__version__)"`. We support PyLate >= 1.3.3.'
      placeholder: "1.3.3"
    validations:
      required: true

  - type: dropdown
    id: loss
    attributes:
      label: Loss / call site
      options:
        - "Contrastive"
        - "CachedContrastive"
        - "Distillation (colbert_kd_scores)"
        - "Custom — calls colbert_scores() directly"
        - "Inference only (scores_T / model.similarity)"
        - "Other (describe below)"
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
        python -c "import triton; print('triton', triton.__version__)"
        python -c "import late_interaction_kernels as lik; print('lik', lik.__version__)"
        python -c "import pylate, sentence_transformers as st; print('pylate', pylate.__version__, 'st', st.__version__)"
        nvidia-smi | head -5
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducer
      description: |
        Ideally < 30 lines. Should import `patch_pylate`, build a tiny batch,
        and call one loss / scoring step. Synthetic tensors are fine.
      render: python
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed vs expected
      description: |
        Tracebacks, score tensor shape / values, loss value,
        parity delta vs `LIK_DISABLE=1` (kill-switch path).
    validations:
      required: true

  - type: checkboxes
    id: kill_switch
    attributes:
      label: Kill-switch check
      description: Did you try reverting to vanilla PyLate to isolate?
      options:
        - label: "Yes — I ran the same code with `LIK_DISABLE=1` (or without `patch_pylate()`) and the behavior differs"
        - label: "No — unsure how to isolate"
